<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Hydro</title>
    <meta name="claude:viewport-fit-sides" content="cover" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Fraunces:opsz,wght,SOFT@9..144,600..700,100&family=JetBrains+Mono:wght@400;500;600&display=swap"
    />
    <script>
      // Apply the saved theme + language before first paint (localStorage is a cache only).
      try {
        var s = JSON.parse(localStorage.getItem("hydro.ui") || "null")
        if (s && (s.theme === "light" || s.theme === "dark")) document.documentElement.setAttribute("data-app-theme", s.theme)
        if (s && s.lang === "en") document.documentElement.lang = "en"
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

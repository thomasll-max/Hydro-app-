# Version locale de Hydro (amis) : site statique, hors ligne, sans compte.
# Netlify relié au dépôt GitHub. Offre gratuite : 300 crédits par mois, 15 par mise en ligne (20 par mois au plus).
# Un push sur main NE met PAS en ligne. Ne sont construits que les commits dont le message contient [deploy]
# (décision de Thomas, 19/10/2026). Pour mettre en ligne : git commit --allow-empty -m "Mise en ligne [deploy]" && git push
[build]
  command = "npm run build:local"
  publish = "dist-local"
  # Code de sortie 0 = build annoncé inutile (annulé, aucun crédit). On construit seulement si le message contient [deploy].
  ignore = "git log -1 --pretty=%B | grep -qF '[deploy]' && exit 1 || exit 0"

[build.environment]
  NODE_VERSION = "22"

# Sécurité (lot 10a). La Content-Security-Policy est écrite au build dans dist-local/_headers (hash des scripts).
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    X-Frame-Options = "DENY"
    # Camera (photos) and microphone (the dictation, lot 11b) for Hydro itself only; the rest switched off.
    Permissions-Policy = "camera=(self), microphone=(self), geolocation=(), payment=(), usb=()"
    Cross-Origin-Opener-Policy = "same-origin"

# Le service worker doit toujours être relu pour que les mises à jour arrivent.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/version.json"
  [headers.values]
    Cache-Control = "no-cache, no-store"
